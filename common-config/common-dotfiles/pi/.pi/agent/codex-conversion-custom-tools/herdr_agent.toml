usage = '''await tools.herdr_agent("help") // Find, message, wait for, read, or answer Pi agents in Herdr panels'''
description = '''Find and coordinate with Pi agents in Herdr panels. send automatically prompts an idle Pi or steers a working Pi; queue=true waits behind current work. It waits by default and returns only the new assistant text.'''
output = "Compact JSON: pane/status plus only relevant panels, text, ask, acknowledgement, timeout, truncation, or transcript-pending fields."
command = "./herdr-agent/herdr-agent.mjs"
input = "stdin"
defer_loading = false
