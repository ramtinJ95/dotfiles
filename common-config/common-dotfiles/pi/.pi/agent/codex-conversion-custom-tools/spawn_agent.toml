usage = '''await tools.spawn_agent(JSON.stringify({ agent_type: "explorer" | "reviewer" | "worker", message: string, cwd?: string, label?: string, interactive?: boolean, user_requested?: boolean }))'''
description = "Defaults to a visible, steerable Herdr tab when Herdr is available. Worker is strictly opt-in: use agent_type=worker only when the user explicitly asks to delegate work to a subagent, and set user_requested=true; never select worker proactively. Set interactive=false only when the user explicitly requests no interactivity, pane, or tab. Outside Herdr it uses an isolated headless Pi. Supply a concise task label. Relative cwd resolves from Pi's working directory."
output = "Inside Herdr: JSON with tab, pane, label, status, and assistant text. Outside Herdr: assistant text."
command = "./spawn-agent/spawn-agent.mjs"
input = "stdin"
defer_loading = false
yield_time_ms = 30000
