name: Feature request
description: Suggest an improvement to the skill, lenses, validator, or docs
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the review problem first. Implementation ideas are welcome
        after the use case is clear.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today when visualizing a code change?
      placeholder: Large refactors need a fate-map default lens…
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: >
        What should change in the skill, template, references, or validator?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or related tools.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Skill workflow (SKILL.md)
        - Validator (validate_mermaid.py)
        - Lens recipes / references
        - Output template
        - Docs / examples
        - Packaging / pi.dev gallery
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for duplicates
          required: true
