term xterm-256color

font_family postscript_name=MesloLGSNF-Regular
bold_font auto
italic_font auto
bold_italic_font auto

hide_window_decorations titlebar-and-corners
confirm_os_window_close 1
background_opacity 0.95
dynamic_background_opacity yes
background_blur 12

include /Users/ramtin/.config/macarchy/state/adapters/kitty.conf

window_border_width 1.5pt
draw_minimal_borders no

tab_bar_edge top
tab_bar_align center
tab_bar_style separator
enabled_layouts splits,stack
tab_separator "  "
tab_bar_min_tabs 2
tab_bar_margin_width 2.0
tab_bar_margin_height 2.0 0.0
tab_title_template " {title} "
active_tab_font_style bold
inactive_tab_font_style normal

map F11 toggle_fullscreen
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
map shift+enter send_text all \x1b\r

allow_remote_control yes
shell_integration no-cursor

cursor_shape block
cursor_trail 5
cursor_blink_interval -1
cursor_stop_blinking_after 0
enable_audio_bell no
notify_on_cmd_finish never
window_alert_on_bell no
macos_dock_badge_on_bell no

copy_on_select clipboard
strip_trailing_spaces smart
select_by_word_characters @-./_~?&=%+#

include bindings.conf
