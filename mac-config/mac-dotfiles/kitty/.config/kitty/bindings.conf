map ctrl+g>c new_tab
map ctrl+g>x close_tab
map ctrl+g>n next_tab
map ctrl+g>p previous_tab
map ctrl+g>, set_tab_title
map ctrl+g>. move_tab_forward
map ctrl+g>< move_tab_backward

map ctrl+g>1 goto_tab 1
map ctrl+g>2 goto_tab 2
map ctrl+g>3 goto_tab 3
map ctrl+g>4 goto_tab 4
map ctrl+g>5 goto_tab 5
map ctrl+g>6 goto_tab 6
map ctrl+g>7 goto_tab 7
map ctrl+g>8 goto_tab 8
map ctrl+g>9 goto_tab 9

map ctrl+g>% launch --location=vsplit --cwd=current
map ctrl+g>" launch --location=hsplit --cwd=current
map ctrl+g>z toggle_layout stack

map ctrl+g>h neighboring_window left
map ctrl+g>j neighboring_window down
map ctrl+g>k neighboring_window up
map ctrl+g>l neighboring_window right

map ctrl+g>w close_window
map ctrl+g>d quit
map ctrl+g>shift+r load_config_file

map --new-mode resize ctrl+g>r
map --mode resize h resize_window narrower
map --mode resize j resize_window shorter
map --mode resize k resize_window taller
map --mode resize l resize_window wider
map --mode resize shift+h resize_window narrower 5
map --mode resize shift+j resize_window shorter 5
map --mode resize shift+k resize_window taller 5
map --mode resize shift+l resize_window wider 5
map --mode resize = resize_window reset
map --mode resize esc pop_keyboard_mode
map --mode resize enter pop_keyboard_mode
map --mode resize q pop_keyboard_mode

map ctrl+g>[ launch --stdin-source=@screen_scrollback --type=overlay nvim -c "set nolist nonumber norelativenumber" -c "autocmd TermOpen * normal G" -

map ctrl+g>s combine : new_tab : set_tab_title main : new_tab : set_tab_title AI : new_tab : set_tab_title temp : new_tab : set_tab_title temp2 : goto_tab 1
