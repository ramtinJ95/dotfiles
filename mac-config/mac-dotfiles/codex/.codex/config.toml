model = "gpt-5.5"
model_provider = "openai"
model_reasoning_effort = "high"
model_verbosity = "medium"

sandbox_mode = "danger-full-access"
approval_policy = "never"
personality = "pragmatic"
web_search = "live"               # replacement for deprecated [features].web_search_request
project_doc_fallback_filenames = ["CLAUDE.md"]
suppress_unstable_features_warning = true
service_tier = "fast"
approvals_reviewer = "user"

[features]
view_image_tool = true            # enable the view image tool
multi_agent = true
child_agents_md = true
memories = true

[sandbox_workspace_write]
network_access = true

[notice]
hide_gpt5_1_migration_prompt = true
fast_default_opt_out = true

[notice.model_migrations]
"gpt-5.1-codex" = "gpt-5.2-codex"

[tui]
status_line = ["current-dir", "model-with-reasoning", "five-hour-limit", "weekly-limit", "context-window-size", "context-usage"]

[tui.model_availability_nux]
"gpt-5.5" = 4

