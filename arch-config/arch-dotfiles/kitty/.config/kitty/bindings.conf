# Tmux-style bindings with ctrl+f as leader
# Tab management
map ctrl+f>c new_tab
map ctrl+f>x close_tab
map ctrl+f>n next_tab
map ctrl+f>p previous_tab
map ctrl+f>, set_tab_title
map ctrl+f>. move_tab_forward
map ctrl+f>< move_tab_backward

# Navigate to specific tab (1-9)
map ctrl+f>1 goto_tab 1
map ctrl+f>2 goto_tab 2
map ctrl+f>3 goto_tab 3
map ctrl+f>4 goto_tab 4
map ctrl+f>5 goto_tab 5
map ctrl+f>6 goto_tab 6
map ctrl+f>7 goto_tab 7
map ctrl+f>8 goto_tab 8
map ctrl+f>9 goto_tab 9

# Window management (splits)
map ctrl+f>% launch --location=vsplit --cwd=current
map ctrl+f>" launch --location=hsplit --cwd=current
map ctrl+f>z toggle_layout stack

# Navigate between windows
map ctrl+f>h neighboring_window left
map ctrl+f>j neighboring_window down
map ctrl+f>k neighboring_window up
map ctrl+f>l neighboring_window right

# Close window
map ctrl+f>w close_window

# Detach (close all tabs/windows)
map ctrl+f>d quit

# Reload configuration
map ctrl+f>shift+r load_config_file

# Resize mode - continuous resizing without repeating leader key
map --new-mode resize ctrl+f>r

# In resize mode, use h/j/k/l to resize continuously
map --mode resize h resize_window narrower
map --mode resize j resize_window shorter
map --mode resize k resize_window taller
map --mode resize l resize_window wider

# Larger steps with Shift
map --mode resize shift+h resize_window narrower 5
map --mode resize shift+j resize_window shorter 5
map --mode resize shift+k resize_window taller 5
map --mode resize shift+l resize_window wider 5

# Reset all window sizes
map --mode resize = resize_window reset

# Exit resize mode
map --mode resize esc pop_keyboard_mode
map --mode resize enter pop_keyboard_mode
map --mode resize q pop_keyboard_mode
