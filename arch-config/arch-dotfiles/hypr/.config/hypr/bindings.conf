# Application bindings
$terminal = uwsm app -- $TERMINAL
$browser = omarchy-launch-browser

bindd = SUPER, RETURN, Terminal, exec, $terminal --working-directory="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Focus Browser, focuswindow, class:^(chromium)$
#bindd = SUPER SHIFT ALT, B, Browser (private), exec, $browser --private
#bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
#bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, T, Activity, exec, $terminal -e btop
#bindd = SUPER SHIFT, D, Docker, exec, $terminal -e lazydocker
#bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus signal "uwsm app -- signal-desktop"
#bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus obsidian "uwsm app -- obsidian -disable-gpu --enable-wayland-ime"
#bindd = SUPER SHIFT, slash, Passwords, exec, uwsm app -- 1password

# If your web app url contains #, type it as ## to prevent hyperland treat it as comments
bindd = SUPER SHIFT, C, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
#bindd = SUPER SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
#bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
#bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-or-focus-webapp YouTube "https://youtube.com/"
#bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
#bindd = SUPER SHIFT CTRL, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
#bindd = SUPER SHIFT, X, X, exec, omarchy-launch-webapp "https://x.com/"
#bindd = SUPER SHIFT ALT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER SHIFT, SPACE
# bindd = SUPER SHIFT, SPACE, Omarchy menu, exec, omarchy-menu
unbind = SUPER SHIFT, N
unbind = SUPER SHIFT, G
unbind = SUPER SHIFT, O
unbind = SUPER SHIFT, slash
unbind = SUPER SHIFT ALT, B
unbind = SUPER SHIFT, M
unbind = SUPER SHIFT, D
unbind = SUPER SHIFT ALT, A
unbind = SUPER SHIFT, E
unbind = SUPER SHIFT ALT, G
unbind = SUPER SHIFT ALT, G
unbind = SUPER SHIFT ALT, X
unbind = SUPER SHIFT, X
unbind = SUPER SHIFT, A
unbind = SUPER SHIFT, F

bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus-webapp Spotify "https://open.spotify.com"
bindd = SUPER SHIFT, D, Discord, exec, omarchy-launch-or-focus-webapp Discord "https://discord.com/channels/@me"
bindd = SUPER SHIFT, G, Github, exec, omarchy-launch-or-focus-webapp Github "https://github.com/"
bindd = SUPER SHIFT, S, Slack, exec, omarchy-launch-or-focus-webapp Slack "https://app.slack.com/client/T04CAJ1RK/C04CAJ1RT"
bindd = SUPER SHIFT, A, Focus Terminal, focuswindow, class:^(kitty)$
bindd = SUPER SHIFT, F, Fullscreen, fullscreen, 1
#bindd = SUPER SHIFT, A, Focus Terminal, focuswindow, class:^(com.mitchellh.ghostty)$
bindd = SUPER SHIFT ALT, B, Browser, exec, $browser

# Window focus navigation with Alt+HJKL
bind = ALT, H, movefocus, l
bind = ALT, J, movefocus, d
bind = ALT, K, movefocus, u
bind = ALT, L, movefocus, r

# Window movement with Alt+Ctrl+HJKL
bind = ALT CTRL, H, movewindow, l
bind = ALT CTRL, J, movewindow, d
bind = ALT CTRL, K, movewindow, u
bind = ALT CTRL, L, movewindow, r

# macOS-style screenshot bindings
bindd = ALT SHIFT, 4, Screenshot region (macOS style), exec, omarchy-cmd-screenshot

# Lock and suspend keybinds
bindd = SUPER SHIFT, L, Lock screen, exec, omarchy-lock-screen
bindd = SUPER SHIFT ALT, L, Suspend, exec, systemctl suspend

#Clamshell mode - disable internal screen when lid closes
bindl = , switch:on:Lid Switch, exec, /home/ramtinj/.config/hypr/clamshell-handler.sh close
bindl = , switch:off:Lid Switch, exec, /home/ramtinj/.config/hypr/clamshell-handler.sh open

