bindd = SUPER , M, Music, exec, omarchy-launch-or-focus-webapp Spotify "https://open.spotify.com"
bindd = SUPER , T, Activity, exec, omarchy-launch-tui btop
bindd = SUPER , D, Discord, exec, omarchy-launch-or-focus-webapp Discord "https://discord.com/channels/@me"
bindd = SUPER , G, Github, exec, omarchy-launch-or-focus-webapp Github "https://github.com/"
bindd = SUPER , S, Slack, exec, omarchy-launch-or-focus-webapp Slack "https://app.slack.com/client/T04CAJ1RK/C04CAJ1RT"
bindd = SUPER , A, Focus Terminal, focuswindow, class:^(kitty)$
bindd = SUPER SHIFT, F, Fullscreen, fullscreen, 1
#bindd = SUPER SHIFT, A, Focus Terminal, focuswindow, class:^(com.mitchellh.ghostty)$
bindd = SUPER SHIFT, B, Browser, exec, $browser
bindd = SUPER, B, Focus Browser, focuswindow, class:^(chromium)$
bindd = SUPER , C, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER, N, File manager, exec, $fileManager
# Window focus navigation with Alt+HJKL
bind = ALT, H, movefocus, l
bind = ALT, J, movefocus, d
bind = ALT, K, movefocus, u
bind = ALT, L, movefocus, r

# Window movement with Alt+Ctrl+HJKL
bind = ALT CTRL, H, movewindow, l
bind = ALT CTRL, J, movewindow, d
bind = ALT CTRL, K, movewindow, u
bind = ALT CTRL, L, movewindow, r

# macOS-style screenshot bindings
bindd = ALT SHIFT, 4, Screenshot region (macOS style), exec, omarchy-capture-screenshot region

# Dygma Defy currently sends Alt+Backspace for this physical key.
# Treat it as plain Backspace everywhere so tap/hold delete one character at a time.
bind = ALT, Backspace, sendshortcut, , Backspace, activewindow

# Lock and suspend keybinds
bindd = SUPER SHIFT, L, Lock screen, exec, omarchy-lock-screen
bindd = SUPER SHIFT ALT, L, Suspend, exec, systemctl suspend
