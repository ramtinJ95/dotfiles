# Change the default Omarchy look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    # No gaps between windows
    gaps_in = 5
    gaps_out = 4, 10, 10, 10

    # Use master layout instead of dwindle
    layout = master
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Use round window corners
    # rounding = 8
    blur {
        enabled = true
      }
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    # Prevent new windows from stealing focus from external monitor
    focus_on_activate = false
    # Keep focus on current monitor when switching workspaces
    disable_autoreload = false
}

master {
    orientation = right
    mfact = 0.63
    new_status = slave
  }

# Workspace rules to bind specific workspaces to external monitor
# These will dynamically bind to whichever external monitor is connected
workspace = 1, monitor:DP-7, default:true  # Home office (BenQ)
workspace = 2, monitor:DP-7
workspace = 3, monitor:DP-7  
workspace = 4, monitor:DP-7
workspace = 5, monitor:DP-7

# Work office workspace assignments (Dell monitor)
workspace = 1, monitor:DP-1, default:true  # Work office (Dell)
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-1
workspace = 4, monitor:DP-1  
workspace = 5, monitor:DP-1

