[filetype]
rules = [
  { mime = "image/*", fg = "#98b5a6" },
  { mime = "{audio,video}/*", fg = "#e9b25f" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#bd93a3" },
  { mime = "application/{pdf,doc,rtf}", fg = "#a5b76c" },
  { url = "*/", fg = "#f0b565" },
  { url = "*", fg = "#e9dcc3" },
]
