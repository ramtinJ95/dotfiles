# Generated by ~/.config/omarchy/hooks/theme-set
# Do not edit directly; change the hook or active Omarchy theme colors.

[mgr]
cwd = { fg = "#94e2d5" }
hovered = { fg = "#1f1f28", bg = "#dcd7ba", bold = true }
preview_hovered = { underline = true }
find_keyword = { fg = "#f9e2af", bold = true, italic = true, underline = true }
find_position = { fg = "#dcd7ba", bg = "reset", bold = true, italic = true }
marker_copied = { fg = "#a6e3a1", bg = "#a6e3a1" }
marker_cut = { fg = "#f38ba8", bg = "#f38ba8" }
marker_marked = { fg = "#89b4fa", bg = "#89b4fa" }
marker_selected = { fg = "#f9e2af", bg = "#f9e2af" }
count_copied = { fg = "#1f1f28", bg = "#a6e3a1" }
count_cut = { fg = "#1f1f28", bg = "#f38ba8" }
count_selected = { fg = "#1f1f28", bg = "#f9e2af" }
border_symbol = "│"
border_style = { fg = "#585b70" }

[tabs]
active = { fg = "#1f1f28", bg = "#dcd7ba", bold = true }
inactive = { fg = "#585b70", bg = "#1f1f28" }

[mode]
normal_main = { fg = "#1f1f28", bg = "#dcd7ba", bold = true }
normal_alt = { fg = "#dcd7ba", bg = "#1f1f28" }
select_main = { fg = "#1f1f28", bg = "#a6e3a1", bold = true }
select_alt = { fg = "#a6e3a1", bg = "#1f1f28" }
unset_main = { fg = "#1f1f28", bg = "#dcd7ba", bold = true }
unset_alt = { fg = "#dcd7ba", bg = "#1f1f28" }

[status]
perm_sep = { fg = "#585b70" }
perm_type = { fg = "#89b4fa" }
perm_read = { fg = "#f9e2af" }
perm_write = { fg = "#f38ba8" }
perm_exec = { fg = "#a6e3a1" }
progress_label = { fg = "#dcd7ba", bold = true }
progress_normal = { fg = "#dcd7ba", bg = "#1f1f28" }
progress_error = { fg = "#f38ba8", bg = "#1f1f28" }

[pick]
border = { fg = "#dcd7ba" }
active = { fg = "#dcd7ba", bold = true }
inactive = {}

[input]
border = { fg = "#dcd7ba" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#dcd7ba" }

[tasks]
border = { fg = "#dcd7ba" }
title = {}
hovered = { fg = "#dcd7ba", underline = true }

[which]
mask = { bg = "#1f1f28" }
cand = { fg = "#94e2d5" }
rest = { fg = "#585b70" }
desc = { fg = "#dcd7ba" }
separator = "  "
separator_style = { fg = "#585b70" }

[help]
on = { fg = "#94e2d5" }
run = { fg = "#dcd7ba" }
hovered = { reversed = true, bold = true }
footer = { fg = "#1f1f28", bg = "#dcd7ba" }

[notify]
title_info = { fg = "#a6e3a1" }
title_warn = { fg = "#f9e2af" }
title_error = { fg = "#f38ba8" }

[filetype]
rules = [
  { mime = "image/*", fg = "#94e2d5" },
  { mime = "{audio,video}/*", fg = "#f9e2af" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#dcd7ba" },
  { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },
  { url = "*/", fg = "#dcd7ba" },
  { url = "*", fg = "#dcd7ba" },
]
